<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Guvolution API Чат</title>
    <link rel="stylesheet" href="static/style.css" />
</head>
<body>
<div class="layout">
    <div class="left-panel">
        <h2>Результаты</h2>
        <div id="result-box" class="result-box"></div>
    </div>
    <div class="right-panel">
        <div class="history-section">
            <h2>История</h2> <div id="history-box" class="history-box"></div>
        </div> <form class="form-panel" id="chat-form">
        <div class="input-group">
            <label for="user-input">Запрос пользователя</label>
            <input type="text" id="user-input" required />
        </div> <div class="input-group">
        <label for="phone-input">Номер телефона</label>
        <input type="text" id="phone-input"  />
    </div> <div class="input-group"> <label for="id-input">или ID</label>
        <input type="text" id="id-input"  /> </div>
        <div class="input-group"> <label>
            <input type="checkbox" id="test-mode" /> Получить тестовый результат
        </label>
        </div>
        <button type="submit">Отправить</button>
    </form>
    </div>
</div>
<script src="static/script.js"></script>
</body>
</html>
